version: 2

models:
  - name: fct_complaints
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: company_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

  - name: dim_company
    columns:
      - name: company_key
        data_tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_key
        data_tests: [unique, not_null]

  - name: dim_issue
    columns:
      - name: issue_key
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]