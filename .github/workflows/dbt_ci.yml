name: dbt CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_CI_SCHEMA: ci_pr_${{ github.event.pull_request.number || github.run_id }}
    defaults:
      run:
        working-directory: cfpb_dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install "dbt-core~=1.12.0" "dbt-databricks~=1.13.0"

      - name: dbt build (models + tests) in CI schema
        run: dbt build --profiles-dir ci

      - name: Drop CI schema
        if: always()        # clean up even if the build failed
        run: dbt run-operation drop_ci_schema --profiles-dir ci